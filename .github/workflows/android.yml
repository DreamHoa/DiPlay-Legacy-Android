name: Okavango API 22 build

on:
  push:
    branches: [okavango-api22]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Also build/test sample apps and the Android device-test APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: okavango-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check public source inputs
        run: |
          python3 -m unittest discover -s scripts/tests -p test_public_tree.py
          python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;25.2.9519653
      - uses: gradle/actions/setup-gradle@v4
      - name: Core unit tests, app lint, and source APK
        run: |
          chmod +x gradlew
          ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug --no-daemon
      - name: Optional full legacy and device-test suite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
        run: |
          ./gradlew :home:testDebugUnitTest :home:lintDebug :maphost:lintDebug :home:assembleDebug :maphost:assembleDebug :mobile:assembleDebugAndroidTest --no-daemon
      - name: Verify source-only APK
        shell: bash
        run: |
          set -euo pipefail
          apk=mobile/build/outputs/apk/debug/mobile-debug.apk
          test -s "$apk"
          unzip -Z -1 "$apk" > "$RUNNER_TEMP/source-apk-contents.txt"
          if grep -Eq '^assets/offline-mfi/(identity\.pk8|certificate\.p7b)$' "$RUNNER_TEMP/source-apk-contents.txt"; then
            echo "::error::MFi material must never be present in the ordinary source APK."
            exit 1
          fi
          mkdir -p handoff
          cp "$apk" handoff/DiPlay-Okavango-source.apk
          (cd handoff && sha256sum DiPlay-Okavango-source.apk > SHA256SUMS.txt)
      - name: Downloadable source APK
        uses: actions/upload-artifact@v4
        with:
          name: diplay-okavango-api22
          path: handoff/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okavango-test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            samples/home/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
          retention-days: 7
