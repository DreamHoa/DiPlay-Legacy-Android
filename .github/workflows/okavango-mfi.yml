name: Okavango MFi car-test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: okavango-api22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;25.2.9519653
      - uses: gradle/actions/setup-gradle@v4
      - name: Provision MFi assets
        shell: bash
        env:
          MFI_KEY: ${{ secrets.DIPLAY_MFI_PK8_B64 }}
          MFI_CERT: ${{ secrets.DIPLAY_MFI_P7B_B64 }}
        run: |
          set -euo pipefail
          test -n "$MFI_KEY" && test -n "$MFI_CERT" || { echo "::error::Missing MFi Secrets"; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/okavango-assets/offline-mfi"
          printf '%s' "$MFI_KEY" | base64 -d > "$RUNNER_TEMP/okavango-assets/offline-mfi/identity.pk8"
          printf '%s' "$MFI_CERT" | base64 -d > "$RUNNER_TEMP/okavango-assets/offline-mfi/certificate.p7b"
          test -s "$RUNNER_TEMP/okavango-assets/offline-mfi/identity.pk8"
          test -s "$RUNNER_TEMP/okavango-assets/offline-mfi/certificate.p7b"
      - name: Build authenticated test APK
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/okavango-assets
        run: |
          chmod +x gradlew
          ./gradlew :mobile:lintDebug :mobile:assembleStandaloneDebug --no-daemon --stacktrace
      - name: Check signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk=mobile/build/outputs/apk/debug/mobile-debug.apk
          test -s "$apk"
          unzip -Z -1 "$apk" | grep -Fxq assets/offline-mfi/identity.pk8
          unzip -Z -1 "$apk" | grep -Fxq assets/offline-mfi/certificate.p7b
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --min-sdk-version 22 --verbose "$apk"
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$apk" "$RUNNER_TEMP/apk/DiPlay-Okavango-MFi.apk"
          (cd "$RUNNER_TEMP/apk" && sha256sum DiPlay-Okavango-MFi.apk > SHA256SUMS.txt)
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: okavango-mfi-test
          path: ${{ runner.temp }}/apk/
          if-no-files-found: error
          retention-days: 3
      - name: Clear local authentication files
        if: always()
        run: rm -rf "$RUNNER_TEMP/okavango-assets"
