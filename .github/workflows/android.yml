name: Okavango API 22 build
on:
  push:
    branches: [okavango-api22]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: okavango-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check public source inputs
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;25.2.9519653
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, and APKs required by AGENTS.md
        run: |
          chmod +x gradlew
          ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest \
            :mobile:lintDebug :home:lintDebug :maphost:lintDebug \
            :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug \
            :mobile:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Collect local packaging helpers
        run: |
          mkdir -p handoff/crypto
          cp shared/build/intermediates/runtime_library_classes_jar/debug/bundleLibRuntimeToJarDebug/classes.jar handoff/crypto/shared.jar
          find "$HOME/.gradle/caches/modules-2/files-2.1" -type f \
            \( -name 'bcprov-jdk18on-1.79.jar' -o -name 'kotlin-stdlib-2.*.jar' \) \
            -exec cp {} handoff/crypto/ \;
          cp mobile/build/outputs/apk/debug/mobile-debug.apk handoff/DiPlay-Okavango-source.apk
          cp mobile/build/outputs/apk/androidTest/debug/mobile-debug-androidTest.apk handoff/DiPlay-Okavango-tests.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" handoff/
          # Runtime identity and persistent signing keys stay on the owner's laptop.
          sha256sum handoff/*.apk > handoff/SHA256SUMS
      - name: Downloadable source APK and local packaging helpers
        uses: actions/upload-artifact@v4
        with:
          name: diplay-okavango-api22
          path: handoff/
          retention-days: 7
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okavango-test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            samples/home/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
          retention-days: 7
