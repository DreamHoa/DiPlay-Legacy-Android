name: Verify Okavango release signature
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: build-tools;36.0.0
      - name: Download and verify the published APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$REPOSITORY" --pattern '*.apk' --dir release-apk
          mapfile -t apks < <(find release-apk -maxdepth 1 -name '*.apk')
          test "${#apks[@]}" -eq 1
          python3 scripts/verify_okavango_apk.py "${apks[0]}" "$RUNNER_TEMP/verified" --authenticated
